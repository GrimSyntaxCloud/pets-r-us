<%- include('header.html') -%>

    <div id="landingPageHeader">
        <img class="" src="/images/Pets-R-Us.png" alt="logo" width="320" height="320">
    </div>
    <div class="main-container">
        <section id="contact">
            <h1 class="section-header">Registration Form</h1>
            <div class="section-content">
                <form class="contact-form" action="/registration" method="post">
                    <input name="_csrf" value="<%= csrfToken %>" type="hidden">
                    <label for="txtUserName">Username</label>
                    <input type="text" id="txtUserName" name="txtUserName" required autofocus placeholder="Your name..">

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="12" maxlength="128" required autocomplete="new-password" placeholder="Enter a password..">

                    <label for="email">Email</label>
                    <input type="email" required id="email" name="email" placeholder="Enter Email...">
                    <input type="submit" value="Register" class="submit-form">
                </form>
            </div>
        </section>
    </div>
<%- include('footer.html') %>
